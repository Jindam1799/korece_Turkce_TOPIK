<html lang="tr">
<head>
<meta charset="utf-8">

<title>덩어리숲 · Korece Kelime Ormanı</title>

<style>
:root{--paper:#f7f7ef;--ink:#263f36;--muted:#778077;--green:#315e48;--light:#edf2e8;--line:#e3e7dc;--orange:#db794c;--red:#b94b3d;--leaf:#91af63;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:#e9ecdf;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}
.ko{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
.app{position:relative;height:100dvh;max-width:480px;margin:auto;background:linear-gradient(180deg,#fbf6e3 0%,var(--paper) 38%);overflow:hidden;
 padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom))}
@media(min-width:500px){.app{box-shadow:0 0 0 1px var(--line),0 20px 60px #243e361a;max-height:900px;margin-top:max(0px,calc((100dvh - 900px)/2));border-radius:0}}
.screen{height:100%;display:flex;flex-direction:column;gap:10px}
/* üst çubuk */
.top{display:flex;align-items:center;gap:10px;flex:none}
.brand{display:flex;align-items:center;gap:9px;flex:1}
.brand-icon{width:38px;height:38px;border-radius:13px 13px 13px 4px;background:var(--green);color:#fff;display:grid;place-items:center;font:800 15px "Noto Sans KR",sans-serif;flex:none}
.brand b{display:block;font:800 19px/1.15 "Noto Sans KR",sans-serif;letter-spacing:-.5px}
.brand small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex:none}
.lang button{border:0;background:transparent;padding:6px 9px;font-size:13px;font-weight:800;min-height:36px;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--green);color:#fff}
.icon{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;flex:none;padding:0}
.icon svg{width:20px;height:20px}
/* ana sayfa */
.companion{flex:1;min-height:0;background:var(--light);border-radius:24px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.habitat{flex:1;min-height:0;position:relative;display:grid;place-items:end center;background:#f8dfc0;overflow:hidden}
.scene{position:absolute;inset:0}.scene svg{width:100%;height:100%;display:block}
.scene .bal{animation:float 7s ease-in-out infinite}.scene .bal:nth-of-type(2){animation-duration:9s;animation-delay:-3s}.scene .bal:nth-of-type(3){animation-duration:8s;animation-delay:-5s}
.scene .ferry{animation:sail 40s linear infinite}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes sail{from{transform:translateX(-80px)}to{transform:translateX(480px)}}
.mascot{position:relative;height:80%;max-height:280px;aspect-ratio:180/210;margin-bottom:3%;transform-origin:50% 90%;animation:breathe 3.5s ease-in-out infinite}
.mascot svg{width:100%;height:100%;display:block;overflow:visible}
.expression-happy,.expression-lift,.expression-land{display:none}
.mascot.hop .expression-normal,.happy .expression-normal{display:none}.mascot.hop .expression-happy,.happy .expression-happy{display:inline}
.mascot.hop{animation:hop .55s ease 2}.mascot.sad{animation:wob .4s ease 2}
.cinfo{padding:10px 16px 14px;background:#fff;border-top:1px solid var(--line)}
.crow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cname{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;font-weight:800;border-radius:30px;padding:3px 10px;background:#dce7d3;color:var(--green);white-space:nowrap}
.bar{height:9px;border-radius:9px;background:#e6eadd;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .6s}
.tiny{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.stats div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px 4px;text-align:center}
.stats strong{display:block;font-size:19px;line-height:1.2}.stats span{font-size:11px;color:var(--muted)}
.opts{display:flex;gap:8px;flex:none}
.opts select,.opts .chip{flex:1;min-height:42px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:6px 10px;font-size:14px;font-weight:700}
.chip[aria-pressed=true]{border-color:var(--green);background:#f3f6ee;color:var(--green)}
.primary,.secondary{border:0;min-height:52px;border-radius:14px;padding:10px 18px;font-weight:800;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.primary{background:var(--green);color:#fff}.primary:active{background:#254b39}
.secondary{background:var(--light);color:var(--green)}
.btns{display:grid;grid-template-columns:2fr 1fr;gap:8px;flex:none}
/* oyun */
.gtop{display:flex;align-items:center;gap:10px;flex:none}
.gtop .count{font-weight:800;font-size:15px}.gtop .xp{margin-left:auto;color:var(--orange);font-weight:800;font-size:14px}
.lines{flex:none;display:grid;gap:5px}
.line{height:6px;border-radius:6px;background:#e6eadd;overflow:hidden}.line i{display:block;height:100%;background:var(--green);transition:width .3s}
.line.timer i{background:var(--orange);transition:none}.line.timer.urgent i{background:var(--red)}
.trow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.trow .urgent{color:var(--red);font-weight:800}
.qcard{flex:1;min-height:0;background:#fff;border:1px solid var(--line);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 14px;position:relative}
.qkind{position:absolute;top:10px;left:12px;font-size:12px;font-weight:800;color:var(--green);background:var(--light);border-radius:30px;padding:3px 10px}
.qkind.bonus{background:#fbe9df;color:var(--orange)}.qkind.rev{background:#f1ecdf;color:#976640}
.qmini{position:absolute;top:2px;right:6px;width:72px;height:84px}
.qmini svg{width:100%;height:100%}
.qins{font-size:14px;color:var(--muted);margin:14px 0 6px}
.qword{font:800 clamp(30px,10vw,46px)/1.25 "Noto Sans KR",sans-serif;letter-spacing:-1px;word-break:keep-all;margin:0}
.qword.long{font-size:clamp(24px,7.5vw,34px)}
.say{border:0;background:var(--light);color:var(--green);border-radius:999px;width:40px;height:40px;display:inline-grid;place-items:center;padding:0;flex:none;margin-top:8px}
.say svg{width:20px;height:20px}.say.sm{width:32px;height:32px;margin:0}.say.sm svg{width:16px;height:16px}
.answers{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.answer{display:flex;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:14px;min-height:clamp(64px,11dvh,84px);padding:10px;background:#fff;font-size:15px;font-weight:600;line-height:1.25}
.answer .n{font-size:11px;color:var(--muted);background:#f2f3ed;display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:7px}
.answer.ok{border-color:var(--green);background:#e5efdc;color:var(--green)}
.answer.no{border-color:var(--red);background:#f8e4e0;color:var(--red)}
.answer.dim{opacity:.45}
.hint{flex:none;text-align:center}
/* geri bildirim (alt sayfa) */
.sheet-wrap{position:absolute;inset:0;background:#1e362d55;display:flex;align-items:flex-end;z-index:10;padding:10px}
.sheet{width:100%;background:#fff;border-radius:24px;padding:18px 18px calc(16px + env(safe-area-inset-bottom));max-height:calc(100% - 20px);overflow:auto;animation:up .22s ease;text-align:center}
.ficon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;font-size:22px;font-weight:800;background:var(--light);color:var(--green)}
.ficon.no{background:#f8e4e0;color:var(--red)}
.sheet h2{margin:0;font-size:22px}
.reward{color:var(--orange);font-weight:800;font-size:14px;min-height:20px;margin:2px 0 8px}
.acard{background:var(--paper);border-radius:16px;padding:12px;text-align:left;display:grid;gap:4px;margin-bottom:10px}
.acard .w{display:flex;align-items:center;gap:8px;font:800 24px "Noto Sans KR",sans-serif}
.acard .m{font-weight:800;font-size:17px;color:var(--green)}
.acard .ex{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.acard .mine{font-size:13px;color:var(--red);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.pairs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pairs span{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.note{font-size:14px;color:var(--muted);margin:0 0 10px}
.sheet .primary+.secondary{margin-top:8px}
/* sonuç */
.rhead{text-align:center;flex:none}
.rhead h2{margin:4px 0 0;font-size:24px}
.rstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.rstats div{background:var(--light);border-radius:14px;padding:10px 4px;text-align:center}
.rstats strong{display:block;font-size:23px}.rstats span{font-size:11px;color:var(--muted)}
.rlist{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:4px 12px}
.ritem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ritem:last-child{border:0}
.ritem div{flex:1}.ritem strong{font:800 17px "Noto Sans KR",sans-serif;display:block}.ritem small{color:var(--muted);font-size:13px}
.empty{padding:18px 4px;color:var(--muted);text-align:center}
.rmini{width:84px;height:98px;margin:0 auto}.rmini svg{width:100%;height:100%}
/* açılır pencereler */
.modal{position:absolute;inset:0;background:#1e362d66;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.box{background:#fff;border-radius:24px;width:100%;max-height:100%;overflow:auto;padding:20px;animation:up .22s ease}
.box h2{margin:0 0 6px;font-size:22px;letter-spacing:-.4px}
.letter{background:var(--paper);border-left:4px solid var(--orange);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:15px}
.letter p{margin:0 0 6px}.letter .sig{text-align:right;font-weight:800;color:var(--green);margin:0}
.how{margin:8px 0;padding-left:18px;font-size:14px;color:var(--muted)}.how li{margin:2px 0}
.chrome{background:#fbe9df;border-radius:14px;padding:10px 12px;font-size:14px;margin:8px 0}
.chrome a,.chrome button{display:inline-flex;align-items:center;min-height:40px;margin:6px 6px 0 0;border:0;border-radius:10px;padding:6px 12px;font-weight:800;text-decoration:none;font-size:14px}
.chrome a{background:var(--orange);color:#fff}.chrome button{background:#fff}
.field{display:flex;gap:8px;margin:8px 0}
.field input{flex:1;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-size:16px;background:#fff}
.choice{display:grid;gap:8px;margin:10px 0}
.choice.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.choice.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pick{border:1.5px solid var(--line);border-radius:16px;background:var(--paper);padding:6px 4px 8px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:800;line-height:1.2}
.pick svg{width:100%;max-width:86px;height:auto;aspect-ratio:180/210}
.pick:hover,.pick:focus-visible{border-color:var(--green);background:var(--light)}
.lvbox{text-align:center}.lvbox .rmini{width:120px;height:140px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.set h3{margin:12px 0 6px;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{min-height:40px;border:1.5px solid var(--line);border-radius:30px;background:#fff;padding:6px 12px;font-size:14px;font-weight:700}
.whead{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}.whead h2{flex:1}
@media(max-height:720px){.box{padding:16px}.letter{font-size:14px;padding:10px 12px;margin:8px 0}.how{font-size:13px;margin:6px 0}.chrome{font-size:13px;padding:8px 10px}.chrome a,.chrome button{min-height:36px;margin-top:4px}.field input{min-height:42px}}
@keyframes breathe{50%{transform:translateY(-5px) rotate(1.5deg)}}
@keyframes hop{40%{transform:translateY(-14px) scale(.96,1.05)}75%{transform:translateY(0) scale(1.05,.95)}}
@keyframes wob{30%{transform:rotate(-6deg)}70%{transform:rotate(6deg)}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-height:640px){.app{padding-top:calc(6px + env(safe-area-inset-top))}.screen{gap:7px}.stats strong{font-size:16px}.primary,.secondary{min-height:46px}.cinfo{padding:8px 14px 10px}.qins{margin:10px 0 2px}.brand small{display:none}}

.sel2{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.sel2 select{min-height:42px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:6px 8px;font-size:14px;font-weight:700;width:100%}
.btn3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;flex:none}
.btn3 .primary,.btn3 .secondary{font-size:15px;padding:8px 6px;line-height:1.15}
.cardzone{flex:1;min-height:0;perspective:1200px;display:flex}
.flip{position:relative;flex:1;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1);cursor:pointer;border:0;background:none;padding:0;text-align:center}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:8px;overflow:hidden}
.face.back{transform:rotateY(180deg);background:var(--paper)}
.face .lbl{position:absolute;top:12px;left:14px;font-size:12px;font-weight:800;color:var(--muted)}
.face .tap{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.face .big{font:800 clamp(30px,10vw,48px)/1.25 "Noto Sans KR",sans-serif;letter-spacing:-1px;word-break:keep-all;margin:0}
.face .big.long{font-size:clamp(24px,7.5vw,34px)}
.face .mean{font-weight:800;font-size:clamp(20px,6vw,26px);color:var(--green);line-height:1.25}
.face .bko{font:800 20px "Noto Sans KR",sans-serif;display:flex;align-items:center;gap:8px}
.plist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;width:100%;max-width:340px;text-align:left}
.plist li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 10px;display:flex;gap:8px;align-items:center}
.plist li div{flex:1}.plist b{display:block;font:700 15px "Noto Sans KR",sans-serif}.plist span{font-size:13px;color:var(--muted)}
.kbtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:none}
.kbtns button{min-height:56px;border-radius:14px;font-weight:800;font-size:16px;border:1.5px solid var(--line);background:#fff}
.kbtns .no{color:var(--red);border-color:#efc9c2;background:#fdf3f1}.kbtns .yes{color:#fff;background:var(--green);border-color:var(--green)}
.thanks{background:var(--light);border-radius:14px;padding:10px 12px;font-size:14px;margin:8px 0}
.thanks b{color:var(--green)}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6}
.foot a,.biz a{color:var(--green);font-weight:800;word-break:break-all}
.biz{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;margin-top:10px}
.biz button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;margin-left:6px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-spk" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
 <symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
 <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
 <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
</svg>

<div class="app" id="app">
 <section class="screen" id="home">
  <div class="top">
   <div class="brand"><span class="brand-icon">숲</span><div><b>덩어리숲</b><small data-t="sub"></small></div></div>
   <div class="lang"><button data-lang="tr">TR</button><button data-lang="ko">한</button></div>
   <button class="icon" id="bMsg" data-al="msg"><svg><use href="#i-mail"/></svg></button>
   <button class="icon" id="bSet" data-al="settings"><svg><use href="#i-set"/></svg></button>
  </div>
  <div class="companion">
   <div class="habitat"><div class="scene" id="scene" aria-hidden="true"></div><div class="mascot" id="mascot"></div></div>
   <div class="cinfo">
    <div class="crow"><span class="cname" id="cName"></span><span class="tag" id="cLv"></span></div>
    <div class="bar"><i id="xpBar"></i></div>
    <div class="crow tiny"><span id="cGrowth"></span><span id="xpText"></span></div>
   </div>
  </div>
  <div class="stats">
   <div><strong id="stLearn">0</strong><span data-t="learned"></span></div>
   <div><strong id="stRev">0</strong><span data-t="toReview"></span></div>
   <div><strong id="stBest">0</strong><span data-t="bestStreak"></span></div>
  </div>
  <div class="sel2"><select id="selLv" data-al="level"></select><select id="selUnit" data-al="unit"></select></div>
  <div class="btn3"><button class="primary" id="bStart"></button><button class="secondary" id="bCards"></button><button class="secondary" id="bReview"></button></div>
 </section>

 <section class="screen" id="game" hidden>
  <div class="gtop"><button class="icon" id="bQuit" data-al="quit"><svg><use href="#i-x"/></svg></button><span class="count" id="gCount"></span><span class="xp" id="gXp"></span></div>
  <div class="lines">
   <div class="line"><i id="gProg"></i></div>
   <div class="line timer" id="tLine"><i id="gTimer"></i></div>
   <div class="trow"><span id="gMode"></span><span id="gTime"></span></div>
  </div>
  <div class="qcard">
   <span class="qkind" id="qKind"></span><div class="qmini" id="qMini"></div>
   <p class="qins" id="qIns"></p><h1 class="qword ko" id="qWord" lang="ko"></h1>
   <button class="say" id="qSay" data-al="listen"><svg><use href="#i-spk"/></svg></button>
  </div>
  <div class="answers" id="answers"></div>
  <p class="tiny hint" data-t="hint"></p>
