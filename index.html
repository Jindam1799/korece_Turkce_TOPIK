<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>덩어리숲 · TOPIK Kelime Ormanı</title>
<meta name="description" content="덩어리숲 — TOPIK 5-6 Korece kelime oyunu. Türk ve Azerbaycanlı arkadaşlar için.">
<meta property="og:title" content="덩어리숲 · TOPIK Kelime Ormanı">
<meta property="og:description" content="Korece kelimeyi gör, Türkçe anlamını seç. Eş kelimelerle çalış, bitki arkadaşını büyüt!">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jindam1799.github.io/korece_Turkce_TOPIK/">
<meta name="theme-color" content="#315e48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f7ef;--ink:#263f36;--muted:#778077;--green:#315e48;--light:#edf2e8;--line:#e3e7dc;--orange:#db794c;--red:#b94b3d;--leaf:#91af63;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:#e9ecdf;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}
.ko{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
.app{position:relative;height:100dvh;max-width:480px;margin:auto;background:linear-gradient(180deg,#fbf6e3 0%,var(--paper) 38%);overflow:hidden;
 padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom))}
@media(min-width:500px){.app{box-shadow:0 0 0 1px var(--line),0 20px 60px #243e361a;max-height:900px;margin-top:max(0px,calc((100dvh - 900px)/2));border-radius:0}}
.screen{height:100%;display:flex;flex-direction:column;gap:10px}
/* üst çubuk */
.top{display:flex;align-items:center;gap:10px;flex:none}
.brand{display:flex;align-items:center;gap:9px;flex:1}
.brand-icon{width:38px;height:38px;border-radius:13px 13px 13px 4px;background:var(--green);color:#fff;display:grid;place-items:center;font:800 15px "Noto Sans KR",sans-serif;flex:none}
.brand b{display:block;font:800 19px/1.15 "Noto Sans KR",sans-serif;letter-spacing:-.5px}
.brand small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex:none}
.lang button{border:0;background:transparent;padding:6px 9px;font-size:13px;font-weight:800;min-height:36px;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--green);color:#fff}
.icon{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;flex:none;padding:0}
.icon svg{width:20px;height:20px}
/* ana sayfa */
.companion{flex:1;min-height:0;background:var(--light);border-radius:24px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.habitat{flex:1;min-height:0;position:relative;display:grid;place-items:end center;
 background:radial-gradient(120% 60% at 50% 115%,#c9d8b0 0 55%,transparent 56%),radial-gradient(80% 40% at 15% 100%,#d7e3c2 0 60%,transparent 61%),linear-gradient(180deg,#f3f1dc,#eef2e7)}
.habitat .cloud{position:absolute;background:#ffffffb0;border-radius:40px;height:16px}
.mascot{height:92%;max-height:300px;aspect-ratio:180/210;margin-bottom:4%;transform-origin:50% 90%;animation:breathe 3.5s ease-in-out infinite}
.mascot svg{width:100%;height:100%;display:block;overflow:visible}
.mascot.hop{animation:hop .55s ease 2}.mascot.sad{animation:wob .4s ease 2}
.cinfo{padding:10px 16px 14px;background:#fff;border-top:1px solid var(--line)}
.crow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cname{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;font-weight:800;border-radius:30px;padding:3px 10px;background:#dce7d3;color:var(--green);white-space:nowrap}
.bar{height:9px;border-radius:9px;background:#e6eadd;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .6s}
.tiny{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.stats div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px 4px;text-align:center}
.stats strong{display:block;font-size:19px;line-height:1.2}.stats span{font-size:11px;color:var(--muted)}
.opts{display:flex;gap:8px;flex:none}
.opts select,.opts .chip{flex:1;min-height:42px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:6px 10px;font-size:14px;font-weight:700}
.chip[aria-pressed=true]{border-color:var(--green);background:#f3f6ee;color:var(--green)}
.primary,.secondary{border:0;min-height:52px;border-radius:14px;padding:10px 18px;font-weight:800;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.primary{background:var(--green);color:#fff}.primary:active{background:#254b39}
.secondary{background:var(--light);color:var(--green)}
.btns{display:grid;grid-template-columns:2fr 1fr;gap:8px;flex:none}
/* oyun */
.gtop{display:flex;align-items:center;gap:10px;flex:none}
.gtop .count{font-weight:800;font-size:15px}.gtop .xp{margin-left:auto;color:var(--orange);font-weight:800;font-size:14px}
.lines{flex:none;display:grid;gap:5px}
.line{height:6px;border-radius:6px;background:#e6eadd;overflow:hidden}.line i{display:block;height:100%;background:var(--green);transition:width .3s}
.line.timer i{background:var(--orange);transition:none}.line.timer.urgent i{background:var(--red)}
.trow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.trow .urgent{color:var(--red);font-weight:800}
.qcard{flex:1;min-height:0;background:#fff;border:1px solid var(--line);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 14px;position:relative}
.qkind{position:absolute;top:10px;left:12px;font-size:12px;font-weight:800;color:var(--green);background:var(--light);border-radius:30px;padding:3px 10px}
.qkind.bonus{background:#fbe9df;color:var(--orange)}.qkind.rev{background:#f1ecdf;color:#976640}
.qmini{position:absolute;top:2px;right:6px;width:72px;height:84px}
.qmini svg{width:100%;height:100%}
.qins{font-size:14px;color:var(--muted);margin:14px 0 6px}
.qword{font:800 clamp(30px,10vw,46px)/1.25 "Noto Sans KR",sans-serif;letter-spacing:-1px;word-break:keep-all;margin:0}
.qword.long{font-size:clamp(24px,7.5vw,34px)}
.say{border:0;background:var(--light);color:var(--green);border-radius:999px;width:40px;height:40px;display:inline-grid;place-items:center;padding:0;flex:none;margin-top:8px}
.say svg{width:20px;height:20px}.say.sm{width:32px;height:32px;margin:0}.say.sm svg{width:16px;height:16px}
.answers{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.answer{display:flex;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:14px;min-height:clamp(64px,11dvh,84px);padding:10px;background:#fff;font-size:15px;font-weight:600;line-height:1.25}
.answer .n{font-size:11px;color:var(--muted);background:#f2f3ed;display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:7px}
.answer.ok{border-color:var(--green);background:#e5efdc;color:var(--green)}
.answer.no{border-color:var(--red);background:#f8e4e0;color:var(--red)}
.answer.dim{opacity:.45}
.hint{flex:none;text-align:center}
/* geri bildirim (alt sayfa) */
.sheet-wrap{position:absolute;inset:0;background:#1e362d55;display:flex;align-items:flex-end;z-index:10;padding:10px}
.sheet{width:100%;background:#fff;border-radius:24px;padding:18px 18px calc(16px + env(safe-area-inset-bottom));max-height:calc(100% - 20px);overflow:auto;animation:up .22s ease;text-align:center}
.ficon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;font-size:22px;font-weight:800;background:var(--light);color:var(--green)}
.ficon.no{background:#f8e4e0;color:var(--red)}
.sheet h2{margin:0;font-size:22px}
.reward{color:var(--orange);font-weight:800;font-size:14px;min-height:20px;margin:2px 0 8px}
.acard{background:var(--paper);border-radius:16px;padding:12px;text-align:left;display:grid;gap:4px;margin-bottom:10px}
.acard .w{display:flex;align-items:center;gap:8px;font:800 24px "Noto Sans KR",sans-serif}
.acard .m{font-weight:800;font-size:17px;color:var(--green)}
.acard .ex{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.acard .mine{font-size:13px;color:var(--red);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.pairs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pairs span{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.note{font-size:14px;color:var(--muted);margin:0 0 10px}
.sheet .primary+.secondary{margin-top:8px}
/* sonuç */
.rhead{text-align:center;flex:none}
.rhead h2{margin:4px 0 0;font-size:24px}
.rstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.rstats div{background:var(--light);border-radius:14px;padding:10px 4px;text-align:center}
.rstats strong{display:block;font-size:23px}.rstats span{font-size:11px;color:var(--muted)}
.rlist{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:4px 12px}
.ritem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ritem:last-child{border:0}
.ritem div{flex:1}.ritem strong{font:800 17px "Noto Sans KR",sans-serif;display:block}.ritem small{color:var(--muted);font-size:13px}
.empty{padding:18px 4px;color:var(--muted);text-align:center}
.rmini{width:84px;height:98px;margin:0 auto}.rmini svg{width:100%;height:100%}
/* açılır pencereler */
.modal{position:absolute;inset:0;background:#1e362d66;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.box{background:#fff;border-radius:24px;width:100%;max-height:100%;overflow:auto;padding:20px;animation:up .22s ease}
.box h2{margin:0 0 6px;font-size:22px;letter-spacing:-.4px}
.letter{background:var(--paper);border-left:4px solid var(--orange);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:15px}
.letter p{margin:0 0 6px}.letter .sig{text-align:right;font-weight:800;color:var(--green);margin:0}
.how{margin:8px 0;padding-left:18px;font-size:14px;color:var(--muted)}.how li{margin:2px 0}
.chrome{background:#fbe9df;border-radius:14px;padding:10px 12px;font-size:14px;margin:8px 0}
.chrome a,.chrome button{display:inline-flex;align-items:center;min-height:40px;margin:6px 6px 0 0;border:0;border-radius:10px;padding:6px 12px;font-weight:800;text-decoration:none;font-size:14px}
.chrome a{background:var(--orange);color:#fff}.chrome button{background:#fff}
.field{display:flex;gap:8px;margin:8px 0}
.field input{flex:1;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-size:16px;background:#fff}
.choice{display:grid;gap:8px;margin:10px 0}
.choice.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.choice.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pick{border:1.5px solid var(--line);border-radius:16px;background:var(--paper);padding:6px 4px 8px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:800;line-height:1.2}
.pick svg{width:100%;max-width:86px;height:auto;aspect-ratio:180/210}
.pick:hover,.pick:focus-visible{border-color:var(--green);background:var(--light)}
.lvbox{text-align:center}.lvbox .rmini{width:120px;height:140px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.set h3{margin:12px 0 6px;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{min-height:40px;border:1.5px solid var(--line);border-radius:30px;background:#fff;padding:6px 12px;font-size:14px;font-weight:700}
.whead{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}.whead h2{flex:1}
@media(max-height:720px){.box{padding:16px}.letter{font-size:14px;padding:10px 12px;margin:8px 0}.how{font-size:13px;margin:6px 0}.chrome{font-size:13px;padding:8px 10px}.chrome a,.chrome button{min-height:36px;margin-top:4px}.field input{min-height:42px}}
@keyframes breathe{50%{transform:translateY(-5px) rotate(1.5deg)}}
@keyframes hop{40%{transform:translateY(-14px) scale(.96,1.05)}75%{transform:translateY(0) scale(1.05,.95)}}
@keyframes wob{30%{transform:rotate(-6deg)}70%{transform:rotate(6deg)}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-height:640px){.app{padding-top:calc(6px + env(safe-area-inset-top))}.screen{gap:7px}.stats strong{font-size:16px}.primary,.secondary{min-height:46px}.cinfo{padding:8px 14px 10px}.qins{margin:10px 0 2px}.brand small{display:none}}
</style>
</head>

 <symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
 <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
 <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
</svg>

<div class="app" id="app">
 <!-- ANA SAYFA -->
 <section class="screen" id="home">
  <div class="top">
   <div class="brand"><span class="brand-icon">숲</span><div><b>덩어리숲</b><small data-t="sub"></small></div></div>
   <div class="lang"><button data-lang="tr">TR</button><button data-lang="ko">한</button></div>
   <button class="icon" id="bMsg" data-al="msg"><svg><use href="#i-mail"/></svg></button>
   <button class="icon" id="bSet" data-al="settings"><svg><use href="#i-set"/></svg></button>
  </div>
  <div class="companion">
   <div class="habitat"><span class="cloud" style="width:70px;top:16%;left:10%"></span><span class="cloud" style="width:44px;top:28%;right:12%"></span>
    <div class="mascot" id="mascot"></div></div>
   <div class="cinfo">
    <div class="crow"><span class="cname" id="cName"></span><span class="tag" id="cLv"></span></div>
    <div class="bar"><i id="xpBar"></i></div>
    <div class="crow tiny"><span id="cGrowth"></span><span id="xpText"></span></div>
   </div>
  </div>
  <div class="stats">
   <div><strong id="stLearn">0</strong><span data-t="learned"></span></div>
   <div><strong id="stRev">0</strong><span data-t="toReview"></span></div>
   <div><strong id="stBest">0</strong><span data-t="bestStreak"></span></div>
  </div>
  <div class="opts">
   <select id="selCat" data-al="category"></select>
   <button class="chip" id="bTimer"></button>
  </div>
  <div class="btns">
   <button class="primary" id="bStart"></button>
   <button class="secondary" id="bReview"></button>
  </div>
 </section>

 <!-- OYUN -->
 <section class="screen" id="game" hidden>
  <div class="gtop">
   <button class="icon" id="bQuit" data-al="quit"><svg><use href="#i-x"/></svg></button>
   <span class="count" id="gCount"></span>
   <span class="xp" id="gXp"></span>
  </div>
  <div class="lines">
   <div class="line"><i id="gProg"></i></div>
   <div class="line timer" id="tLine"><i id="gTimer"></i></div>
   <div class="trow"><span id="gMode"></span><span id="gTime"></span></div>
  </div>
  <div class="qcard">
   <span class="qkind" id="qKind"></span>
   <div class="qmini" id="qMini"></div>
   <p class="qins" id="qIns"></p>
   <h1 class="qword ko" id="qWord" lang="ko"></h1>
   <button class="say" id="qSay" data-al="listen"><svg><use href="#i-spk"/></svg></button>
  </div>
  <div class="answers" id="answers"></div>
  <p class="tiny hint" data-t="hint"></p>
  <div class="sheet-wrap" id="fb" hidden><div class="sheet" role="dialog" aria-modal="true">
   <div class="ficon" id="fIcon">✓</div>
   <h2 id="fTitle"></h2>
   <div class="reward" id="fReward"></div>
   <div class="acard">
    <div class="w ko"><span id="fWord"></span><button class="say sm" id="fSay" data-al="listen"><svg><use href="#i-spk"/></svg></button></div>
    <div class="m" id="fMean"></div>
    <div class="ex ko" id="fExWrap"><span id="fEx"></span><button class="say sm" id="fSayEx" data-al="listen"><svg><use href="#i-spk"/></svg></button></div>
    <div class="pairs ko" id="fPairs"></div>
    <div class="mine" id="fMine" hidden></div>
   </div>
   <p class="note" id="fNote"></p>
   <button class="primary" id="fNext"></button>
   <button class="secondary" id="fSkip" hidden></button>
  </div></div>
 </section>

 <!-- SONUÇ -->
 <section class="screen" id="result" hidden>
  <div class="rhead"><div class="rmini" id="rMini"></div><h2 id="rTitle"></h2><p class="tiny" id="rSub" style="margin:2px 0 0"></p></div>
  <div class="rstats">
   <div><strong id="rCorrect"></strong><span data-t="correct"></span></div>
   <div><strong id="rXp"></strong><span data-t="nutrient"></span></div>
   <div><strong id="rStreak"></strong><span data-t="streak"></span></div>
  </div>
  <p class="tiny" style="margin:0;font-weight:800" data-t="mistakes"></p>
  <div class="rlist" id="rList"></div>
  <div class="btns">
   <button class="primary" id="rHome"></button>
   <button class="secondary" id="rRetry"></button>
  </div>
 </section>

 <!-- HOŞ GELDİN -->
 <div class="modal" id="mWel" hidden><div class="box">
  <div class="whead"><h2 data-t="welTitle"></h2><div class="lang"><button data-lang="tr">TR</button><button data-lang="ko">한</button></div></div>
  <div class="letter"><p data-t="letter"></p><p class="sig" data-t="sig"></p></div>
  <ul class="how"><li data-t="how1"></li><li data-t="how2"></li><li data-t="how3"></li></ul>
  <div class="field"><input id="nameIn" maxlength="14" data-ph="namePh"></div>
  <div class="chrome" id="chrome" hidden><span data-t="chromeTxt"></span><br><a id="openChrome" href="#" target="_blank" rel="noopener" data-t="openChrome"></a><button id="copyLink" data-t="copy"></button></div>
  <button class="primary" id="bWel" data-t="start"></button>
 </div></div>

 <!-- SEVİYE / EVRİM -->
 <div class="modal" id="mLv" hidden><div class="box lvbox">
  <h2 id="lvTitle"></h2><p class="tiny" id="lvSub" style="margin:0"></p>
  <div id="lvBody"></div>
 </div></div>

 <!-- AYARLAR -->
 <div class="modal" id="mSet" hidden><div class="box set">
  <h2 data-t="settings"></h2>
  <h3 data-t="lang"></h3><div class="lang" style="width:max-content"><button data-lang="tr">Türkçe</button><button data-lang="ko">한국어</button></div>
  <h3 data-t="roundSize"></h3><div class="chips" id="sizeChips"></div>
  <h3 data-t="sound"></h3><div class="chips"><button class="chip" id="bAuto"></button><button class="chip" id="bTest" data-t="test"></button></div>
  <h3 data-t="name"></h3><div class="field"><input id="nameSet" maxlength="14"></div>
  <button class="secondary" id="bReset" style="margin-top:6px"></button>
  <button class="primary" id="bSetOk" style="margin-top:8px" data-t="ok"></button>
 </div></div>

<script>
{

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const xpStart=L=>{const n=L-1;return Math.round(.4*(100*n+25*n*(n-1)+10*n*(n-1)*(2*n-1)/6))};
const levelOf=xp=>{let L=1;while(xp>=xpStart(L+1))L++;return L};
function growthName(L=S.level){
 if(L===1)return t('seed');if(L===2||!S.pet)return t('sprout');
 const fam=TX[S.lang].fam[S.pet];
 if(L>=10&&S.route){const r=TX[S.lang].route[S.route];return L>=20&&S.branch?t('legend',r):L>=15&&S.branch?t('magic',r):r}
 return L>=4?t('growing',fam):fam;
}
function art(L=S.level,pet=S.pet,route=S.route,branch=S.branch){
 const p=pet||'',r=L>=10?route||null:null,b=L>=15?branch||null:null;
 CH.setProfile({routes:p&&r?{[p]:r}:{},branches:p&&b?{[p]:b}:{}});
 const lv=!p&&L>=3?2:(L>=10&&!r?9:(L>=15&&!b?14:L));
 return CH.creatureSVG(p||'tree',r,lv,undefined,false,b||null);
}
const displayName=()=>S.name||growthName();

 $('xpBar').style.width=Math.min(100,(S.xp-a)/(b-a)*100)+'%';
 $('stLearn').textContent=`${Object.values(S.mem).filter(m=>m.c>0).length}/${WORDS.length}`;
 $('stRev').textContent=S.retry.length;$('stBest').textContent=S.best;
 $('selCat').innerHTML=CATS.map(c=>`<option value="${esc(c)}"${c===S.cat?' selected':''}>${esc(c==='all'?t('all'):TX[S.lang].cat[c])}</option>`).join('');
 $('bTimer').textContent=S.timer?t('timerOn'):t('timerOff');$('bTimer').setAttribute('aria-pressed',S.timer);
 $('bStart').textContent=t('startN',S.size);
 $('bReview').textContent=t('review',S.retry.length);$('bReview').disabled=!S.retry.length;

// ---------- oyun durumu ----------
let state=null,timer=null;
const SECONDS=12,BONUS_EXTRA=2,BASE=5,BONUS=3,STREAK_EVERY=5,STREAK_XP=3;
function show(id){['home','game','result'].forEach(s=>$(s).hidden=s!==id)}
function buildQueue(){
 const pool=WORDS.filter(w=>S.cat==='all'||w.c===S.cat);
 const score=w=>{const m=S.mem[w.id];return (m?m.c*2-m.w:-1)+Math.random()*1.5};
 return pool.slice().sort((x,y)=>score(x)-score(y)).slice(0,S.size);
}
function start(kind){
 const queue=kind==='review'?shuffle(S.retry.map(byId).filter(Boolean)).slice(0,20):buildQueue();
 if(!queue.length)return;
 state={kind,queue,index:0,phase:'q',bonus:false,entry:null,options:[],correct:0,answered:0,xp:0,streak:0,bestStreak:0,mistakes:new Map(),offerBonus:false,chosen:null};
 show('game');ask(false);
}
function optionsFor(e,isPhrase){
 const seen=new Set([e.tr]),wrong=[];
 let cand;
 if(isPhrase){const home=e.parent;cand=[...shuffle(PHRASES.filter(p=>p.parent===home&&p.id!==e.id)),...shuffle(PHRASES.filter(p=>p.parent!==home))]}
 else{const w=e;cand=[...shuffle(WORDS.filter(x=>x!==w&&x.c===w.c)),...shuffle(WORDS.filter(x=>x.c!==w.c))]}
 for(const c of cand){if(!seen.has(c.tr)){wrong.push(c);seen.add(c.tr)}if(wrong.length===3)break}
 return shuffle([e,...wrong]);
}
function ask(bonus){
 clearInterval(timer);
 const item=state.queue[state.index];
 state.bonus=bonus;state.phase='q';state.chosen=null;
 state.entry=bonus?shuffle(item.pairs.slice())[0]:item;
 const isPhrase=bonus||state.entry.id.startsWith('p');
 state.isPhrase=isPhrase;
 state.options=optionsFor(state.entry,isPhrase);
 $('fb').hidden=true;
 renderQuestionText();
 $('answers').innerHTML=state.options.map((o,i)=>`<button class="answer" data-o="${esc(o.id)}"><span class="n">${i+1}</span><span>${esc(o.tr)}</span></button>`).join('');
 $('qMini').innerHTML=art();
 const secs=SECONDS+(bonus?BONUS_EXTRA:0);
 $('tLine').hidden=!S.timer;
 if(S.timer){state.deadline=performance.now()+secs*1000;state.secs=secs;tick();timer=setInterval(tick,100)}else $('gTime').textContent='';
 if(S.auto)speak(state.entry.ko);
 $('answers').querySelector('button').focus({preventScroll:true});
}
function renderQuestionText(){
 const e=state.entry,item=state.queue[state.index],m=S.mem[item.id];
 $('gCount').textContent=`${state.index+1} / ${state.queue.length}`;
 $('gXp').textContent=`+${state.xp} ${t('nutrient').toLowerCase()}`;
 $('gProg').style.width=(state.index/state.queue.length*100)+'%';
 $('gMode').textContent=S.timer?t('modeTimed'):t('modeFree');
 const k=$('qKind');
 if(state.bonus){k.textContent=t('kBonus');k.className='qkind bonus'}
 else if(item.id.startsWith('p')){k.textContent=t('kPairRev');k.className='qkind rev'}
 else if(state.kind==='review'){k.textContent=t('kRev');k.className='qkind rev'}
 else{k.textContent=m?t('kBase'):t('kNew');k.className='qkind'}
 $('qIns').textContent=state.isPhrase?t('qPair'):t('qWord');
 $('qWord').textContent=e.ko;$('qWord').classList.toggle('long',e.ko.length>6);
}
function tick(){
 if(!state||state.phase!=='q')return;
 const left=Math.max(0,(state.deadline-performance.now())/1000);
 $('gTimer').style.width=(left/state.secs*100)+'%';
 $('gTime').textContent=t('sec',left.toFixed(1));
 $('tLine').classList.toggle('urgent',left<=3);$('gTime').classList.toggle('urgent',left<=3);
 if(left<=0)answer(null);
}
function answer(id){
 if(!state||state.phase!=='q')return;
 clearInterval(timer);state.phase='fb';
 const e=state.entry,item=state.queue[state.index],bonus=state.bonus,correct=id===e.id;
 state.chosen=id&&!correct?state.options.find(o=>o.id===id):null;state.timeout=id===null;
 document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;const o=b.dataset.o;b.classList.add(o===e.id?'ok':o===id?'no':'dim')});
 // kayıt
 if(!bonus){
  state.answered++;
  const m=S.mem[item.id]||(S.mem[item.id]={c:0,w:0});
  if(correct){m.c++;state.correct++}else m.w++;
  if(state.kind==='review'&&correct)S.retry=S.retry.filter(x=>x!==item.id);
 }
 if(!correct){state.mistakes.set(e.id,e);if(!S.retry.includes(e.id))S.retry=[...S.retry,e.id].slice(-120)}
 else if(bonus)S.retry=S.retry.filter(x=>x!==e.id);
 let gain=0,sb=0;
 if(!bonus){state.streak=correct?state.streak+1:0;state.bestStreak=Math.max(state.bestStreak,state.streak);S.best=Math.max(S.best,state.streak);
  if(correct&&state.streak%STREAK_EVERY===0)sb=STREAK_XP}
 if(correct)gain=(bonus?BONUS:BASE)+sb;
 state.gain=gain;state.sb=sb;state.correctNow=correct;
 state.offerBonus=!bonus&&correct&&!item.id.startsWith('p')&&item.pairs&&item.pairs.length>0;
 const before=S.level;S.xp+=gain;state.xp+=gain;S.level=Math.max(S.level,levelOf(S.xp));save();
 renderFeedback();$('fb').hidden=false;$('fNext').focus({preventScroll:true});
 if(S.level>before)setTimeout(()=>levelUp(before),350);
}
function renderFeedback(){
 const e=state.entry,correct=state.correctNow,item=state.queue[state.index];
 $('fIcon').textContent=correct?'✓':state.timeout?'◷':'↻';$('fIcon').className='ficon'+(correct?'':' no');
 $('fTitle').textContent=correct?(state.sb?t('streakT',state.streak):t('right')):state.timeout?t('timeup'):t('wrong');
 $('fReward').textContent=correct?t('plus',state.gain,state.sb):state.bonus?t('bonusFree'):t('willRepeat');
 $('fWord').textContent=e.ko;$('fMean').textContent=e.tr;
 const word=e.id.startsWith('p')?WORDS[e.parent]:e;
 $('fEx').textContent=word.ex;
 $('fPairs').innerHTML=e.id.startsWith('w')&&!state.offerBonus?word.pairs.map(p=>`<span>${esc(p.ko)} · ${esc(p.tr)}</span>`).join(''):'';
 $('fMine').hidden=!state.chosen;if(state.chosen)$('fMine').textContent=t('mine')+state.chosen.tr;
 $('fNote').textContent=state.offerBonus?t('askBonus'):correct?t('sayIt'):'';
 const last=state.index===state.queue.length-1;
 $('fNext').textContent=state.offerBonus?t('bonusBtn'):last?t('seeRes'):t('next');
 $('fSkip').hidden=!state.offerBonus;$('fSkip').textContent=last?t('seeRes'):t('skip');
}
function advance(){
 if(state.index>=state.queue.length-1){finish();return}
 state.index++;ask(false);
}
$('answers').addEventListener('click',e=>{const b=e.target.closest('.answer');if(b)answer(b.dataset.o)});
$('fNext').onclick=()=>{if(state.offerBonus){state.offerBonus=false;ask(true)}else advance()};
$('fSkip').onclick=()=>advance();
$('qSay').onclick=()=>speak(state.entry.ko,true);
$('fSay').onclick=()=>speak(state.entry.ko,true);
$('fSayEx').onclick=()=>{const e=state.entry;speak((e.id.startsWith('p')?WORDS[e.parent]:e).ex,true)};
$('bQuit').onclick=()=>{clearInterval(timer);state.answered?finish():(show('home'),renderHome())};
document.addEventListener('keydown',e=>{
 if(!state||$('game').hidden||!$('mLv').hidden)return;
 if(state.phase==='q'&&/^[1-4]$/.test(e.key)){answer(state.options[+e.key-1].id)}
 else if(state.phase==='fb'&&e.key==='Enter'&&document.activeElement.tagName!=='BUTTON'){$('fNext').click()}
});

// ---------- sonuç ----------
function finish(){clearInterval(timer);state.phase='done';save();show('result');renderResult()}
function renderResult(){
 $('rMini').innerHTML=art();
 $('rTitle').textContent=t('resTitle');$('rSub').textContent=t('resSub',state.correct,state.answered);
 $('rCorrect').textContent=state.correct;$('rXp').textContent='+'+state.xp;$('rStreak').textContent=state.bestStreak;
 const list=[...state.mistakes.values()];
 $('rList').innerHTML=list.length?list.map(e=>`<div class="ritem"><div><strong>${esc(e.ko)}</strong><small>${esc(e.tr)}</small></div><button class="say sm" data-s="${esc(e.id)}" aria-label="${esc(t('listen'))}">${SPK}</button></div>`).join(''):`<div class="empty">${esc(t('noMistake'))}</div>`;
 $('rHome').textContent=t('home');$('rRetry').textContent=t('retryWrong');$('rRetry').disabled=!list.length;
}
$('rList').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)speak(byId(b.dataset.s).ko,true)});
$('rHome').onclick=()=>{state=null;show('home');renderHome()};
$('rRetry').onclick=()=>{const ids=[...state.mistakes.keys()];state=null;
 const q=ids.map(byId).filter(Boolean);state={kind:'review',queue:shuffle(q),index:0,phase:'q',correct:0,answered:0,xp:0,streak:0,bestStreak:0,mistakes:new Map()};show('game');ask(false)};
$('bStart').onclick=()=>start('normal');
$('bReview').onclick=()=>start('review');

// ---------- seviye atlama / evrim ----------
function levelUp(from){
 const L=S.level;const box=$('lvBody');$('mLv').hidden=false;clearInterval(timer);
 const need=L>=3&&!S.pet?'fam':L>=10&&!S.route?'route':L>=15&&!S.branch?'branch':null;
 if(need==='fam'){
  $('lvTitle').textContent=t('pickFam');$('lvSub').textContent=t('pickFamSub');
  box.innerHTML=`<div class="choice c3">${Object.keys(CH.GROWTH).map(p=>`<button class="pick" data-pet="${p}">${art(3,p,'','')}<span>${esc(TX[S.lang].fam[p])}</span></button>`).join('')}</div>`;
 }else if(need==='route'){
  $('lvTitle').textContent=t('pickRoute');$('lvSub').textContent=t('pickRouteSub');
  box.innerHTML=`<div class="choice c3">${CH.GROWTH[S.pet].routes.map(r=>`<button class="pick" data-route="${r.id}">${art(10,S.pet,r.id,'')}<span>${esc(TX[S.lang].route[r.id])}</span></button>`).join('')}</div>`;
 }else if(need==='branch'){
  $('lvTitle').textContent=t('pickBranch');$('lvSub').textContent=t('pickBranchSub');
  const r=CH.GROWTH[S.pet].routes.find(x=>x.id===S.route);
  box.innerHTML=`<div class="choice c2">${r.branches.map((b,i)=>`<button class="pick" data-branch="${b.id}">${art(15,S.pet,S.route,b.id)}<span>${esc(t('way'))} ${i+1}</span></button>`).join('')}</div>`;
 }else{
  $('lvTitle').textContent=t('lvUp');$('lvSub').textContent=t('lvSub',L);
  box.innerHTML=`<div class="rmini">${art()}</div><p style="font-weight:800;margin:4px 0 0">${esc(growthName())}</p><button class="primary" id="lvOk" style="margin-top:12px">${esc(t('great'))}</button>`;
  $('lvOk').onclick=closeLv;
 }
}
function closeLv(){$('mLv').hidden=true;renderHome();if(state&&state.phase==='fb')$('qMini').innerHTML=art()}
$('lvBody').addEventListener('click',e=>{const b=e.target.closest('.pick');if(!b)return;
 if(b.dataset.pet)S.pet=b.dataset.pet;if(b.dataset.route)S.route=b.dataset.route;if(b.dataset.branch)S.branch=b.dataset.branch;save();
 const L=S.level;if((L>=3&&!S.pet)||(L>=10&&!S.route)||(L>=15&&!S.branch))levelUp(L);else closeLv();
});

// ---------- ayarlar ----------
function renderSettings(){
 $('sizeChips').innerHTML=[10,20,30].map(n=>`<button class="chip" data-size="${n}" aria-pressed="${n===S.size}">${n}</button>`).join('');
 $('bAuto').textContent=S.auto?t('autoOn'):t('autoOff');$('bAuto').setAttribute('aria-pressed',S.auto);
 $('nameSet').value=S.name;$('bReset').textContent=t('reset');
}
$('sizeChips').addEventListener('click',e=>{const b=e.target.closest('[data-size]');if(b){S.size=+b.dataset.size;save();renderSettings();renderHome()}});
$('bAuto').onclick=()=>{S.auto=!S.auto;save();renderSettings()};
$('bTest').onclick=()=>speak('안녕하세요. 토픽 합격을 응원해요!',true);
$('nameSet').addEventListener('input',e=>{S.name=e.target.value.trim();save();renderHome()});
$('bSet').onclick=()=>{renderSettings();$('mSet').hidden=false};
$('bSetOk').onclick=()=>{$('mSet').hidden=true};
let resetArm=false;
$('bReset').onclick=()=>{if(!resetArm){resetArm=true;$('bReset').textContent=t('resetSure');setTimeout(()=>{resetArm=false;$('bReset').textContent=t('reset')},3000);return}
 Object.assign(S,{xp:0,level:1,pet:'',route:'',branch:'',mem:{},retry:[],best:0});save();resetArm=false;$('mSet').hidden=true;renderHome()};

// ---------- hoş geldin ----------
$('bMsg').onclick=()=>{$('nameIn').value=S.name;$('mWel').hidden=false};
$('bWel').onclick=()=>{const n=$('nameIn').value.trim();if(n)S.name=n;S.welcomed=true;save();$('mWel').hidden=true;renderHome();
 $('mascot').className='mascot hop';setTimeout(()=>$('mascot').className='mascot',1200);speak('안녕하세요! 같이 공부해요.')};

// ---------- ses (kadın sesi öncelikli) ----------
let voice=null;
const FEMALE=/yuna|sora|sunhi|heami|jimin|seoyeon|female|여성|google 한국의|standard-a|wavenet-a|neural2-a/i;
const MALE=/injoon|minsu|hyunsu|bongjin|gookmin|\bmale\b|남성/i;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));
 voice=vs.find(v=>FEMALE.test(v.name))||vs.find(v=>!MALE.test(v.name))||vs[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(text,force){
 if(!S.auto&&!force)return;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';if(voice)u.voice=voice;
  u.rate=.9;u.pitch=voice&&FEMALE.test(voice.name)?1:1.15;speechSynthesis.speak(u)}catch(e){}
}

// ---------- uygulama içi tarayıcı → Chrome ----------
const URL0='https://jindam1799.github.io/korece_Turkce_TOPIK/';
const ua=navigator.userAgent||'';
const inApp=/KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|Line\/|NAVER|DaumApps|everytimeApp|Twitter|Snapchat|TikTok|musical_ly|WhatsApp|Telegram|; wv\)/i.test(ua);
const isAndroid=/Android/i.test(ua),isIOS=/iPhone|iPad|iPod/i.test(ua);
const bare=URL0.replace(/^https?:\/\//,'');
$('openChrome').href=/KAKAOTALK/i.test(ua)?'kakaotalk://web/openExternal?url='+encodeURIComponent(URL0)
 :isAndroid?'intent://'+bare+'#Intent;scheme=https;package=com.android.chrome;end'
 :isIOS?'googlechromes://'+bare:URL0;
$('chrome').hidden=!(inApp&&(isAndroid||isIOS));
$('copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(URL0);$('copyLink').textContent=t('copied')}catch(e){$('copyLink').textContent=URL0}};

// ---------- başlat ----------
S.level=Math.max(S.level,levelOf(S.xp));
applyLang();
$('mWel').hidden=false;$('nameIn').value=S.name;
}
</script>
